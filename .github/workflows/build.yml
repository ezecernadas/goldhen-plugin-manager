name: Build package

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:

jobs:
  build_pkg:
    runs-on: ubuntu-22.04
    steps:

    - name: Checkout
      uses: actions/checkout@main

    - name: Set env vars
      run: |
        echo "llvm_ver=12.0" >> $GITHUB_ENV
        echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV
        echo "sdl_path=SDL-PS4" >> $GITHUB_ENV
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
        echo "OO_SDK_URL=https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/download/0.0.1.416/toolchain.tar.gz" >> $GITHUB_ENV

    - name: Run host unit tests
      run: make test

    - name: Checkout oosdk_libraries
      uses: actions/checkout@main
      with:
        repository: bucanero/oosdk_libraries
        path: oosdk_libraries

    - name: Download OpenOrbis Toolchain
      run: curl -sL ${{ env.OO_SDK_URL }} | tar xz -C ./

    - name: Copy makerules
      run: cp oosdk_libraries/build_rules.mk OpenOrbis/PS4Toolchain/build_rules.mk

    - name: Checkout dbglogger
      uses: actions/checkout@main
      with:
        repository: bucanero/dbglogger
        path: dbglogger

    - name: Checkout SQLite
      uses: actions/checkout@main
      with:
        repository: bucanero/libSQLite-ps4
        path: libSQLite-ps4

    - name: Checkout SDL-PS4
      uses: actions/checkout@main
      with:
        repository: bucanero/SDL-PS4
        path: ${{ env.sdl_path }}
        ref: ps4

    - name: Checkout libjbc
      uses: actions/checkout@main
      with:
        repository: bucanero/ps4-libjbc
        path: ps4-libjbc

    - name: Cache LLVM and Clang
      id: cache-llvm
      uses: actions/cache@main
      with:
        path: ./llvm
        key: llvm-${{ env.llvm_ver }}

    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v1
      with:
        version: ${{ env.llvm_ver }}
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}

    - name: Install SQLite (libc VFS patch)
      working-directory: libSQLite-ps4
      run: |
        patch -p1 < "$GITHUB_WORKSPACE/patches/libSQLite-ps4-libc-vfs.patch"
        make install

    - name: Install dbglogger
      working-directory: dbglogger
      run: make -f Makefile.PS4 install

    - name: Install libjbc
      working-directory: ps4-libjbc
      run: make install

    - name: Cache SDL2
      id: cache-sdl2
      uses: actions/cache@main
      with:
        path: ${{ env.sdl_path }}/orbis/libSDL2.a
        key: ${{ runner.os }}-sdl2

    - name: Install SDL2 library
      if: steps.cache-sdl2.outputs.cache-hit != 'true'
      working-directory: ${{ env.sdl_path }}
      run: |
        sed -i 's/-Werror=declaration-after-statement/-Wno-declaration-after-statement/' CMakeLists.txt
        mkdir orbis && cd orbis
        CFLAGS="-Wno-declaration-after-statement -Wno-error" cmake --toolchain ../cmake/openorbis.cmake ..
        make

    - name: Copy lib
      run: cp ${sdl_path}/orbis/libSDL2.a "${OO_PS4_TOOLCHAIN}/lib"

    - name: Build Plugin Manager App Package
      run: |
        make
        mv IV0000-PLGM00001_00-GOLDHENPLUGINMGR.pkg goldhen-plugin-manager-build_${{ env.sha_name }}.pkg

    - name: Push package artifact
      uses: actions/upload-artifact@main
      with:
        name: goldhen-plugin-manager-build_${{ env.sha_name }}
        path: goldhen-plugin-manager-build_${{ env.sha_name }}.pkg
        if-no-files-found: error
